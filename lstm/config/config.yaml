language: hun
output_dir: ./data
data_dir: ../2022SegmentationST/data
model_suffix: -by_char
model_ext: pt
predictions_ext: tsv
results_ext: txt
seed: 1234

preprocessing:
  min_freq: 2
  batch_size: 32
  shuffle: False
  initial_weights: 0.8

encoder_decoder:
  bidirectional: True
  embedding_dim: 128
  hidden_dim: 512
  n_layers: 1
  dropout: 0.3

training:
  early_stopping: True
  patience: 2
  learning_rate: 0.01 # This is the initial learning rate
  learning_rate_min: 0.0001 # for LR Plateau
  learning_rate_factor: 0.1 # for LR Plateau
  epochs: 7 # training should be stopped by early stopping before this number
  teacher_forcing_ratio: 0.5
  clip: 1.0
  loss_criterion: crossentropy
  weight_decay: 0.0

predictions:
  max_output: 65 # length of longest morpheme string + 2

special_tokens:
  pad_token: <PAD>
  sos_token: <SOS>
  eos_token: <EOS>
  unknown_token: <UNK>
